<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forkcast — You're offline</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#10B981" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(180deg, #ecfdf5 0%, #ffffff 60%);
        color: #0f172a;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        max-width: 480px;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(16, 185, 129, 0.25);
      }
      h1 { font-size: 1.5rem; margin: 24px 0 8px; }
      p  { color: #475569; line-height: 1.55; }
      button {
        margin-top: 24px;
        background: #10B981;
        color: white;
        border: 0;
        border-radius: 10px;
        padding: 12px 20px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #059669; }
      @media (prefers-color-scheme: dark) {
        body { background: linear-gradient(180deg, #0f172a 0%, #020617 60%); color: #f1f5f9; }
        p    { color: #94a3b8; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Forkcast" />
      <h1>You're offline</h1>
      <p>
        Forkcast can't reach the network right now. Your saved meals will
        reload as soon as you're back online.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
