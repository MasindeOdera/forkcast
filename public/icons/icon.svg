<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Fork (left side) -->
  <g stroke="white" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- three tines -->
    <rect x="150" y="90"  width="18" height="90" rx="9"/>
    <rect x="190" y="90"  width="18" height="90" rx="9"/>
    <rect x="230" y="90"  width="18" height="90" rx="9"/>
    <!-- crossbar -->
    <rect x="150" y="170" width="98" height="20" rx="10"/>
    <!-- shaft -->
    <rect x="190" y="185" width="18" height="230" rx="9"/>
    <!-- tip -->
    <circle cx="199" cy="420" r="12"/>
  </g>

  <!-- Bowl / plate (right side) -->
  <g>
    <ellipse cx="360" cy="330" rx="120" ry="46" fill="white" fill-opacity="0.95"/>
    <ellipse cx="360" cy="318" rx="102" ry="34" fill="url(#bowl)"/>
    <!-- food flecks -->
    <circle cx="325" cy="308" r="7" fill="#DC2626"/>
    <circle cx="395" cy="316" r="6" fill="#B91C1C"/>
    <circle cx="365" cy="298" r="5" fill="#FBBF24"/>
    <circle cx="345" cy="322" r="4" fill="#065F46"/>
    <!-- steam -->
    <path d="M330 270 q10 -20 0 -40" stroke="white" stroke-width="6" fill="none"
          stroke-linecap="round" opacity="0.9"/>
    <path d="M360 260 q10 -22 0 -44" stroke="white" stroke-width="6" fill="none"
          stroke-linecap="round" opacity="0.7"/>
    <path d="M390 270 q10 -20 0 -40" stroke="white" stroke-width="6" fill="none"
          stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
